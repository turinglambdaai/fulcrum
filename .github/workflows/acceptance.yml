name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Unified immutable upstream revision containing AppImage handoff,
  # branded-DMG signature preservation, and macOS update rollback safety.
  RIVET_PIN: e18c28e6b6b18ab0f59559e82e30c51c4229d91f

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        shell: pwsh
        run: |
          racket -e '(dynamic-require (quote db) #f)'
          if ($LASTEXITCODE -ne 0) { raco pkg install --auto --no-docs db-lib }
          raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#$env:RIVET_PIN"
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - name: Require generated Windows client to be current
        shell: pwsh
        run: git diff --exit-code -- windows/GeneratedBackend.hpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fulcrum-acceptance-windows
          path: .rivet/acceptance/
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        run: |
          racket -e '(dynamic-require (quote db) #f)' || raco pkg install --auto --no-docs db-lib
          raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_PIN}"
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - name: Require generated macOS client to be current
        run: git diff --exit-code -- macos-host/Sources/RivetHost/GeneratedBackend.swift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fulcrum-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance/
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install native and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-4-dev libglib2.0-dev libsecret-1-dev liblz4-dev zlib1g-dev \
            libncurses-dev libx11-dev libxtst-dev weston xvfb xauth xdotool \
            at-spi2-core python3-pyatspi rpm desktop-file-utils
      - name: Install pinned Rivet and dependencies
        run: |
          racket -e '(dynamic-require (quote db) #f)' || raco pkg install --auto --no-docs db-lib
          raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_PIN}"
      - name: Remember full Racket command path
        run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@e18c28e6b6b18ab0f59559e82e30c51c4229d91f
      - name: Run executable product acceptance
        run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - name: Require generated Linux client to be current
        run: git diff --exit-code -- linux/GeneratedBackend.hpp
      # PR-only, explicitly UNSIGNED QA artifacts. This is deliberately
      # distinct from tag-driven release.yml and the Ed25519 stable feed.
      # Allows a real Ubuntu 26.04 GNOME 50 operator to test #111 using
      # packages built from the exact candidate SHA. Never publish these.
      - name: Build unsigned Linux GNOME 50 QA installers
        if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.14.1-windows-lifecycle'
        shell: bash
        run: |
          set -euo pipefail
          PATH="$FULL_RACKET_BIN:$PATH" raco rivet release --development
          test -f dist/fulcrum-0.14.1-linux-amd64.deb
          test -f dist/fulcrum-0.14.1-linux-x86_64.AppImage
          sha256sum dist/fulcrum-0.14.1-linux-amd64.deb dist/fulcrum-0.14.1-linux-x86_64.AppImage             > dist/gnome50-qa-only-SHA256SUMS
          printf '%s\n' 'QA ONLY - development/unsigned, not a production release.'             'No real GNOME 50 hotkey verification is implied by these packages.'             > dist/gnome50-qa-only-README.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'release/v0.14.1-windows-lifecycle'
        with:
          name: fulcrum-0.14.1-gnome50-qa-UNSIGNED
          path: |
            dist/fulcrum-0.14.1-linux-amd64.deb
            dist/fulcrum-0.14.1-linux-x86_64.AppImage
            dist/gnome50-qa-only-SHA256SUMS
            dist/gnome50-qa-only-README.txt
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fulcrum-acceptance-linux
          path: .rivet/acceptance/
          if-no-files-found: warn
