name: Release

# Tag-driven pipeline producing versioned, architecture-suffixed artifacts —
# fulcrum-<version>-macos-<arch>.dmg + .zip, fulcrum-<version>-windows-x64.msi,
# fulcrum-<version>-linux-x64.tar.gz — each with a .sha256 checksum, a combined
# SHA256SUMS, and the signed stable-channel manifest. `raco rivet release
# --development` exercises the full release flow (package, launch smoke,
# installer) without platform production signing; production trust rides on
# the Ed25519-signed channel manifest. The secrets from
# docs/release-runbook.md switch on Authenticode / Developer ID +
# notarization later via `raco rivet release`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Rivet snapshot carrying the update-fetch redirect fix (#153). Bump this
  # deliberately: the pin, not main, is what release artifacts build on.
  RIVET_PIN: a5f671845594246bb2a189c8cb14c87b8201e43e

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION, rivet.rktd and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG_VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG_VERSION' section"; exit 1; }

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            racket-arch: arm64
          # Intel macs stay on the family matrix (taskly ships the same pair);
          # macos-15-intel is the last Intel runner generation.
          - os: macos-15-intel
            platform: macos
            arch: x64
            racket-arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
            racket-arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: ${{ env.RIVET_PIN }}
      - name: Set up Racket CS 9.3
        if: matrix.platform == 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Racket
        if: matrix.platform != 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # macOS packaging must be arch-native: without this the runner
          # builds under Rosetta and ships an x86_64 app (the PodLens
          # release shipped exactly that bug).
          architecture: ${{ matrix.racket-arch }}
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev
      - name: Cache embeddable Racket CS (Linux)
        if: matrix.platform == 'linux'
        id: cache-racket-embed
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Point Rivet at the embeddable runtime (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          boot_dir="$(dirname "$(find "$RUNNER_TEMP/racket-embed" -name petite.boot -print -quit)")"
          test -n "$boot_dir" || { echo "petite.boot missing from the embed build" >&2; exit 1; }
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_library="$(find "$RUNNER_TEMP/racket-embed" -maxdepth 6 -name 'libracketcs*.a' -print -quit)"
          test -n "$racket_library" || { echo "libracketcs.a missing from the embed build" >&2; exit 1; }
          echo "RIVET_RACKET_BOOT_DIR=$boot_dir" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$racket_library" >> "$GITHUB_ENV"
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        if: matrix.platform == 'windows'
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
        shell: bash
      # `raco rivet release --development` = package + launch smoke + the
      # platform installer (msi/dmg/tar.gz) + a per-platform update manifest
      # discarded here in favor of the composed channel manifest signed
      # centrally below. The release flow requires the update environment to
      # be set even though that manifest is discarded, so the channel key is
      # plumbed through here too.
      - name: Release (development strength)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: fulcrum-2026-10
          RIVET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY_PEM" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          export RIVET_UPDATE_PRIVATE_KEY="$PWD/update-private.der"
          raco rivet release --development
          rm -f update-private.pem update-private.der
        shell: bash
      # Versioned + architecture-suffixed names are the release contract: the
      # channel manifest (.github/sign-manifest.rkt) pins exactly these names,
      # and the mac zip doubles as the portable build the update feed serves.
      - name: Name artifacts and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          case "${{ matrix.platform }}" in
            macos)
              mv dist/fulcrum-*.dmg "fulcrum-${VERSION}-macos-${ARCH}.dmg"
              (cd dist && zip -qry "../fulcrum-${VERSION}-macos-${ARCH}.zip" fulcrum.app)
              ;;
            windows)
              mv dist/fulcrum-*-windows-*.msi "fulcrum-${VERSION}-windows-x64.msi"
              ;;
            linux)
              mv dist/fulcrum-*-linux-*.tar.gz "fulcrum-${VERSION}-linux-x64.tar.gz"
              ;;
          esac
          for f in fulcrum-${VERSION}-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256 "$f" > "$f.sha256"
          done
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-${{ matrix.platform }}-${{ matrix.arch }}
          path: fulcrum-*
          if-no-files-found: error

  channel-manifest:
    name: Sign channel manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: ${{ env.RIVET_PIN }}
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          ls -la release/
      - name: Compose and sign the channel manifest
        env:
          # Manifest URLs are tag-pinned (never re-upload under an existing
          # version URL — hashes are pinned by the signed manifest). The
          # signing key + key id still come from the RIVET_UPDATE_* secrets.
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
        run: |
          # One channel manifest pins every platform artifact (see
          # .github/sign-manifest.rkt). The secret carries the PEM; the
          # signer wants DER paths, and the signed output is verified
          # against the public key before upload.
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          openssl pkey -in update-private.pem -pubout -outform DER -out update-public.der
          racket .github/sign-manifest.rkt
      - uses: actions/upload-artifact@v4
        with:
          name: channel-manifest
          path: dist/manifest.json
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    needs: channel-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          cp artifacts/channel-manifest/manifest.json release/
          (cd release && cat *.sha256 > SHA256SUMS)
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/fulcrum-*
            release/SHA256SUMS
            release/manifest.json
