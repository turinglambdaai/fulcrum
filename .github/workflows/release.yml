name: Release

# Tag-driven pipeline. The 0.1 developer-preview releases run the validation
# and packaging stages that do not need publisher identities; production
# signing (Authenticode / Developer ID + notarization / Ed25519 update
# manifests) activates once the secrets from docs/release-runbook.md exist.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Check tag matches rivet.rktd and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(racket -e '(begin (require racket/file) (hash-ref (file->value "rivet.rktd") (quote version) #f))' | tr -d '"')
          echo "tag=$TAG rivet.rktd=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != rivet.rktd version $VERSION"; exit 1; }
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  package:
    name: Package (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    env:
      HAS_PLATFORM_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' || secrets.MACOS_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: v0.4.0
      - name: Set up Racket CS 9.3
        if: matrix.platform == 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Racket
        if: matrix.platform != 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev
      - name: Cache embeddable Racket CS (Linux)
        if: matrix.platform == 'linux'
        id: cache-racket-embed
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Point Rivet at the embeddable runtime (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          boot_dir="$(dirname "$(find "$RUNNER_TEMP/racket-embed" -name petite.boot -print -quit)")"
          test -n "$boot_dir" || { echo "petite.boot missing from the embed build" >&2; exit 1; }
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_library="$(find "$RUNNER_TEMP/racket-embed" -maxdepth 6 -name 'libracketcs*.a' -print -quit)"
          test -n "$racket_library" || { echo "libracketcs.a missing from the embed build" >&2; exit 1; }
          echo "RIVET_RACKET_BOOT_DIR=$boot_dir" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$racket_library" >> "$GITHUB_ENV"
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      # secrets are unavailable inside if expressions, so the choice reads
      # the job-level env instead: production signing when credentials
      # exist, the unsigned development path otherwise.
      - name: Production package (publisher-signed)
        if: env.HAS_PLATFORM_SIGNING == 'true'
        env:
          RIVET_WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          RIVET_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RIVET_MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          RIVET_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RIVET_MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
        run: raco rivet package --production
        shell: bash
      - name: Development package (unsigned)
        if: env.HAS_PLATFORM_SIGNING != 'true'
        # Plain `raco rivet package` is the unsigned development path;
        # --development is a release-only flag.
        run: raco rivet package
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-${{ matrix.platform }}
          path: |
            dist/
            .rivet/build/**/*.zip
            .rivet/build/**/*.dmg
          if-no-files-found: warn

  update-manifest:
    name: Sign update manifest
    needs: package
    runs-on: ubuntu-latest
    env:
      HAS_UPDATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_UPDATE_KEY == 'true'
      - name: Install Racket
        if: env.HAS_UPDATE_KEY == 'true'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Build manifest from release artifacts
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          RIVET_UPDATE_BASE_URL: ${{ secrets.RIVET_UPDATE_BASE_URL }}
        run: |
          # Compose channel manifest from the packaged artifacts, sign it with
          # the Ed25519 update key, and emit it as a release artifact. The
          # downloads origin is updated by publishing this file to
          # $RIVET_UPDATE_BASE_URL/stable/manifest.json (see runbook §3).
          raco rivet release --development
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPDATE_KEY == 'true'
        with:
          name: update-manifest
          path: dist/manifest.json
          if-no-files-found: warn

  github-release:
    name: Draft GitHub release
    needs: [package, update-manifest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # One archive per platform: the WinUI self-contained layout contains
      # hundreds of runtime files, and expanding them onto the release turns
      # the download page into noise (and into API rate-limit territory).
      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/fulcrum-macos artifacts/fulcrum-windows; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/${name}.zip" .)
          done
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.zip
