name: Release

# Tag-driven pipeline producing one human installer per platform —
# fulcrum-macos.dmg, fulcrum-windows-x64.msi, fulcrum-linux-x64.tar.gz —
# plus the signed stable-channel manifest. `raco rivet release
# --development` exercises the full release flow (package, launch smoke,
# installer) without platform production signing; production trust rides on
# the Ed25519-signed channel manifest. The secrets from
# docs/release-runbook.md switch on Authenticode / Developer ID +
# notarization later via `raco rivet release`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Rivet snapshot carrying the update-fetch redirect fix (#153). Bump this
  # deliberately: the pin, not main, is what release artifacts build on.
  RIVET_PIN: a5f671845594246bb2a189c8cb14c87b8201e43e

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Check tag matches rivet.rktd and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(racket -e '(begin (require racket/file) (hash-ref (file->value "rivet.rktd") (quote version) #f))' | tr -d '"')
          echo "tag=$TAG rivet.rktd=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != rivet.rktd version $VERSION"; exit 1; }
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  package:
    name: Package (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: ${{ env.RIVET_PIN }}
      - name: Set up Racket CS 9.3
        if: matrix.platform == 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Racket
        if: matrix.platform != 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # macOS packaging must be arm64-native: without this the runner
          # builds under Rosetta and ships an x86_64 app (the PodLens
          # release shipped exactly that bug).
          architecture: ${{ matrix.platform == 'macos' && 'arm64' || 'x64' }}
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev
      - name: Cache embeddable Racket CS (Linux)
        if: matrix.platform == 'linux'
        id: cache-racket-embed
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache (Linux)
        if: matrix.platform == 'linux' && steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Point Rivet at the embeddable runtime (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          boot_dir="$(dirname "$(find "$RUNNER_TEMP/racket-embed" -name petite.boot -print -quit)")"
          test -n "$boot_dir" || { echo "petite.boot missing from the embed build" >&2; exit 1; }
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_library="$(find "$RUNNER_TEMP/racket-embed" -maxdepth 6 -name 'libracketcs*.a' -print -quit)"
          test -n "$racket_library" || { echo "libracketcs.a missing from the embed build" >&2; exit 1; }
          echo "RIVET_RACKET_BOOT_DIR=$boot_dir" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$racket_library" >> "$GITHUB_ENV"
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      # rivet.rktd points macos-icon at brand/Fulcrum.icns; the committed
      # source is brand/iconset/, and iconutil is the Apple-blessed way to
      # build the .icns from it.
      - name: Generate macOS icon
        if: matrix.platform == 'macos'
        run: iconutil -c icns brand/iconset -o brand/Fulcrum.icns
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        if: matrix.platform == 'windows'
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      # `raco rivet release --development` = package + launch smoke + the
      # platform installer (msi/dmg/tar.gz) + a per-platform update manifest
      # discarded here in favor of the composed channel manifest signed
      # centrally below. The release flow requires the update environment to
      # be set even though that manifest is discarded, so the channel key is
      # plumbed through here too.
      - name: Release (development strength)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/fulcrum/releases/latest/download
          RIVET_UPDATE_KEY_ID: fulcrum-2026-10
          RIVET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY_PEM" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          export RIVET_UPDATE_PRIVATE_KEY="$PWD/update-private.der"
          raco rivet release --development
          rm -f update-private.pem update-private.der
        shell: bash
      - name: Rename installer for the channel manifest
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos)   mv dist/fulcrum-*-macos.dmg fulcrum-macos.dmg ;;
            windows) mv dist/fulcrum-*-windows-*.msi fulcrum-windows-x64.msi ;;
            linux)   mv dist/fulcrum-*-linux-*.tar.gz fulcrum-linux-x64.tar.gz ;;
          esac
          ls -la
      # The tarball stays the universal distribution; the .deb is the
      # first-class Debian/Ubuntu path — /opt/fulcrum plus /usr/bin symlink,
      # menu entry, and hicolor icons, so the app installs like a native
      # package instead of a folder to babysit.
      - name: Build Debian package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          work="$RUNNER_TEMP/deb-root"
          root="$work/fulcrum"
          rm -rf "$work"
          mkdir -p "$root/DEBIAN" "$root/opt/fulcrum" "$root/usr/bin" \
            "$root/usr/share/applications" "$root/usr/share/icons/hicolor"
          tar -xzf fulcrum-linux-x64.tar.gz -C "$root/opt/fulcrum" --strip-components=1
          binary="$root/opt/fulcrum/fulcrum"
          [ -f "$binary" ] || binary="$root/opt/fulcrum/RivetHost"
          test -f "$binary"
          chmod 0755 "$binary"
          ln -s "/opt/fulcrum/$(basename "$binary")" "$root/usr/bin/fulcrum"
          install -m 0644 packaging/fulcrum.desktop \
            "$root/usr/share/applications/fulcrum.desktop"
          for size in 16 32 48 64 128 256 512; do
            dir="$root/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$dir"
            install -m 0644 "brand/fulcrum-icon-${size}.png" "$dir/fulcrum.png"
          done
          cat > "$root/DEBIAN/control" <<CONTROL
          Package: fulcrum
          Version: $TAG
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1 (>= 4.6), libx11-6, zlib1g, liblz4-1, libtinfo6
          Maintainer: TuringLambdaAI <jirentianxiang1024@gmail.com>
          Description: One keystroke. Everything within reach.
           Keyboard-first launcher: one Racket brain, a first-party GTK4 UI.
           Search apps, clipboard history, snippets, and the web, and run
           actions without leaving the keyboard.
          CONTROL
          dpkg-deb --root-owner-group --build "$root" "fulcrum_${TAG}_amd64.deb"
          dpkg-deb --contents "fulcrum_${TAG}_amd64.deb" | head -5
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-${{ matrix.platform }}
          path: |
            fulcrum-macos.dmg
            fulcrum-windows-x64.msi
            fulcrum-linux-x64.tar.gz
            fulcrum_*_amd64.deb
          if-no-files-found: error

  channel-manifest:
    name: Sign channel manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: ${{ env.RIVET_PIN }}
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-macos/fulcrum-macos.dmg release/
          mv artifacts/fulcrum-windows/fulcrum-windows-x64.msi release/
          mv artifacts/fulcrum-linux/fulcrum-linux-x64.tar.gz release/
          ls -la release/
      - name: Compose and sign the channel manifest
        env:
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          RIVET_UPDATE_BASE_URL: ${{ secrets.RIVET_UPDATE_BASE_URL }}
        run: |
          # One channel manifest pins every platform installer (see
          # .github/sign-manifest.rkt). The secret carries the PEM; the
          # signer wants DER paths, and the signed output is verified
          # against the public key before upload.
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          openssl pkey -in update-private.pem -pubout -outform DER -out update-public.der
          racket .github/sign-manifest.rkt
      - uses: actions/upload-artifact@v4
        with:
          name: channel-manifest
          path: dist/manifest.json
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    needs: channel-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/fulcrum-macos/fulcrum-macos.dmg release/
          cp artifacts/fulcrum-windows/fulcrum-windows-x64.msi release/
          cp artifacts/fulcrum-linux/fulcrum-linux-x64.tar.gz release/
          cp artifacts/fulcrum-linux/fulcrum_*_amd64.deb release/
          cp artifacts/channel-manifest/manifest.json release/
          ls -la release/
      - name: Generate SHA256SUMS
        run: |
          cd release
          sha256sum fulcrum-macos.dmg fulcrum-windows-x64.msi \
            fulcrum-linux-x64.tar.gz fulcrum_*_amd64.deb manifest.json \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Direct pushes mean generate_release_notes has nothing to list; the
      # changelog section is the notes. Render it plus the per-platform
      # install instructions into the release body.
      - name: Render release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          {
            echo "# Fulcrum $TAG"
            echo
            awk -v header="## $TAG" '
              index($0, header) == 1 { in_section = 1; next }
              /^## /                 { in_section = 0 }
              in_section             { print }
            ' CHANGELOG.md
            echo
            cat .github/release-install.md
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            release/fulcrum-macos.dmg
            release/fulcrum-windows-x64.msi
            release/fulcrum-linux-x64.tar.gz
            release/fulcrum_*_amd64.deb
            release/manifest.json
            release/SHA256SUMS.txt
