name: Release

# Tag-driven pipeline producing versioned, architecture-suffixed artifacts —
# fulcrum-<version>-macos-<arch>.dmg + .zip, fulcrum-<version>-windows-x64.msi
# + .zip, fulcrum-<version>-linux-<arch>.tar.gz/.zip plus the native Linux
# installers (fulcrum-<version>-linux-*.deb/.rpm/.AppImage, named by rivet per
# ecosystem) on both x64 and arm64 — each with a .sha256 checksum, a combined
# SHA256SUMS, and the signed stable-channel manifest (update-manifest.json;
# a byte-identical manifest.json rides along while pre-0.8.0 clients are in
# the field). Stable tags MUST use `raco rivet release` with Windows
# Authenticode, macOS Developer ID/notarization, Linux Ed25519, and the
# independent Ed25519 signed update channel; missing secrets stop publishing.

on:
  push:
    tags: ["v*"]
  # A VERSION-bump gate may create its tag with GITHUB_TOKEN. Those push
  # events do not start other workflows; explicitly dispatch the same
  # tag-driven pipeline instead.
  workflow_dispatch:

env:
  # Immutable Rivet merge commit includes the crash-safe AppImageHandoff
  # accepted as upstream #291; v0.12.0 does not contain that API.
  # Single pin source, same value as ci.yml (workflow-level env does not
  # cross files, so this is defined here too). Contexts aren't allowed in
  # `uses:`, so the setup-embed-racket action ref must be bumped in
  # lockstep by hand.
  # Unified immutable upstream revision containing AppImage handoff,
  # branded-DMG signature preservation, and macOS update rollback safety.
  RIVET_PIN: 4cd374f3f783a58306026381a64fc83c0e23ff48
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION, rivet.rktd and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          PACKAGE_VERSION="$(tr -d '\r\n' < VERSION)"
          grep -q "^## \[${PACKAGE_VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${PACKAGE_VERSION}]' section"; exit 1; }


      # Manual tag pushes and workflow_dispatch must not bypass the same
      # exact-commit CI + packaged Product Acceptance gate as VERSION bumps.
      # Stable tags require a main push; prerelease tags may use verified PR
      # runs for a release-candidate branch.
      - name: Require green CI and Product Acceptance for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            allowed_event='(.event == "push" or .event == "pull_request")'
          else
            allowed_event='(.event == "push" and .head_branch == "main")'
          fi
          for workflow in ci.yml acceptance.yml; do
            count="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\" and .status == \"completed\" and $allowed_event)] | length")"
            if [[ "$count" -lt 1 ]]; then
              echo "::error::$workflow has no successful trusted run for tagged commit $GITHUB_SHA"
              exit 1
            fi
            echo "$workflow: trusted green run found for $GITHUB_SHA"
          done

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            racket-arch: arm64
          # Intel macs stay on the family matrix (taskly ships the same pair);
          # macos-15-intel is the last Intel runner generation.
          - os: macos-15-intel
            platform: macos
            arch: x64
            racket-arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
            racket-arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            racket-arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            racket-arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS 9.3
        if: matrix.platform == 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Racket
        if: matrix.platform != 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # macOS packaging must be arch-native: without this the runner
          # builds under Rosetta and ships an x86_64 app (the PodLens
          # release shipped exactly that bug).
          architecture: ${{ matrix.racket-arch }}
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libglib2.0-dev zlib1g-dev liblz4-dev libncurses-dev \
            libxtst-dev \
            rpm desktop-file-utils
      - name: Set up embeddable Racket CS (Linux)
        if: matrix.platform == 'linux'
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@4cd374f3f783a58306026381a64fc83c0e23ff48
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own.
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        if: matrix.platform == 'windows'
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
        shell: bash
      # Like Taskly, generate a 2x Finder DMG background before packaging.
      # Rivet v0.12.0 uses it to stage an Applications alias, set the icon
      # positions, and show the "drag to install" layout.
      - name: Render macOS drag-to-install DMG backdrop
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install librsvg
          bash scripts/render-dmg-background.sh
          python3 scripts/check-macos-dmg-layout.py
      # Production code-signing and notarization are mandatory for stable
      # tags. Credentials only enter trusted tag runners, never PR jobs.
      - name: Configure macOS Developer ID and notary profile
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for key in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID MACOS_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "::error::Production macOS credential $key is missing"; exit 1; fi
          done
          [[ "$MACOS_SIGN_IDENTITY" == "Developer ID Application:"* ]] || {
            echo "::error::Expected an Apple Developer ID Application signing identity"; exit 1;
          }
          signing_dir="$(mktemp -d "$RUNNER_TEMP/fulcrum-signing.XXXXXX")"
          chmod 700 "$signing_dir"
          keychain="$signing_dir/fulcrum.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$signing_dir/identity.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security import "$signing_dir/identity.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -p codesigning -v "$keychain" | grep -F "$MACOS_SIGN_IDENTITY"
          rm -f "$signing_dir/identity.p12"
          xcrun notarytool store-credentials "fulcrum-notary" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$MACOS_APP_SPECIFIC_PASSWORD" --keychain "$keychain"
          echo "RIVET_MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "RIVET_MACOS_NOTARY_PROFILE=fulcrum-notary" >> "$GITHUB_ENV"
      - name: Configure Windows Authenticode identity
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { throw "Missing WINDOWS_CERTIFICATE_PFX (base64-encoded PFX secret)" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "Missing WINDOWS_CERTIFICATE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { throw "Missing WINDOWS_TIMESTAMP_URL repository variable" }
          $pfx = Join-Path $env:RUNNER_TEMP 'fulcrum-production-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "RIVET_WINDOWS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "RIVET_WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" >> $env:GITHUB_ENV
      - name: Configure Linux Ed25519 artifact signing
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGN_PRIVATE_KEY_PEM: ${{ secrets.LINUX_SIGN_PRIVATE_KEY }}
          LINUX_SIGN_KEY_ID: ${{ secrets.LINUX_SIGN_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "$LINUX_SIGN_PRIVATE_KEY_PEM" && -n "$LINUX_SIGN_KEY_ID" ]] || {
            echo "::error::Linux production signing secrets are missing"; exit 1;
          }
          key_dir="$(mktemp -d "$RUNNER_TEMP/fulcrum-linux-signing.XXXXXX")"
          chmod 700 "$key_dir"
          printf '%s\n' "$LINUX_SIGN_PRIVATE_KEY_PEM" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -outform DER -out "$key_dir/private.der"
          openssl pkey -in "$key_dir/private.pem" -pubout -outform DER -out "$key_dir/public.der"
          rm -f "$key_dir/private.pem"
          echo "RIVET_LINUX_SIGN_PRIVATE_KEY=$key_dir/private.der" >> "$GITHUB_ENV"
          echo "RIVET_LINUX_SIGN_PUBLIC_KEY=$key_dir/public.der" >> "$GITHUB_ENV"
          echo "RIVET_LINUX_SIGN_KEY_ID=$LINUX_SIGN_KEY_ID" >> "$GITHUB_ENV"
      # The channel manifest is separately Ed25519-signed. Build and verify
      # production-signed artifacts first; only then stage anything for publish.
      - name: Release (production signed)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          RIVET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          [[ -n "$RIVET_UPDATE_PRIVATE_KEY_PEM" && "$RIVET_UPDATE_KEY_ID" == "fulcrum-2026-10" ]] || {
            echo "::error::Required Ed25519 update key and pinned key ID are missing"; exit 1;
          }
          temp_root="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then temp_root="$(cygpath -u "$RUNNER_TEMP")"; fi
          key_dir="$(mktemp -d "$temp_root/fulcrum-update-signing.XXXXXX")"
          chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY_PEM" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -outform DER -out "$key_dir/private.der"
          rm -f "$key_dir/private.pem"
          export RIVET_UPDATE_PRIVATE_KEY="$key_dir/private.der"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export RIVET_UPDATE_PRIVATE_KEY="$(cygpath -w "$key_dir/private.der")"
          fi
          raco rivet release
          raco rivet verify --production
        shell: bash
      - name: Verify mounted Finder DMG installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-macos-dmg.sh
          dmg=(dist/fulcrum-*.dmg)
          test -f "${dmg[0]}"
          codesign --verify --verbose=2 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
          spctl --assess --type open --context context:primary-signature "${dmg[0]}"
      # Versioned + architecture-suffixed names are the release contract: the
      # channel manifest (.github/sign-manifest.rkt) pins exactly these names,
      # and the mac zip doubles as the portable build the update feed serves.
      - name: Name artifacts and checksum
        shell: bash
        run: |
          set -euo pipefail
          # RC tags carry a distribution suffix (vX.Y.Z-rc.N), while native
          # MSI/RPM/macOS package versions remain the numeric VERSION value.
          VERSION="$(tr -d '\r\n' < VERSION)"
          ARCH="${{ matrix.arch }}"
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          case "${{ matrix.platform }}" in
            macos)
              mv dist/fulcrum-*.dmg "fulcrum-${VERSION}-macos-${ARCH}.dmg"
              # rivet v0.11 removes the unpacked .app from dist/ once the
              # installers are built; its portable zip (the same payload
              # the update feed serves) already carries the arch suffix —
              # adopt it instead of re-zipping the deleted tree.
              test -f "dist/fulcrum-${VERSION}-macos-${ARCH}.zip"
              test -f "dist/fulcrum-${VERSION}-macos-${ARCH}.zip.sha256"
              mv "dist/fulcrum-${VERSION}-macos-${ARCH}.zip" \
                 "dist/fulcrum-${VERSION}-macos-${ARCH}.zip.sha256" .
              ;;
            windows)
              mv dist/fulcrum-*-windows-*.msi "fulcrum-${VERSION}-windows-x64.msi"
              # rivet's portable zip (same payload the msi installs) with
              # its own sidecar — the update feed's windows artifact shape.
              test -f "dist/fulcrum-${VERSION}-windows-x64.zip"
              test -f "dist/fulcrum-${VERSION}-windows-x64.zip.sha256"
              mv "dist/fulcrum-${VERSION}-windows-x64.zip" \
                 "dist/fulcrum-${VERSION}-windows-x64.zip.sha256" .
              ;;
            linux)
              mv dist/fulcrum-*-linux-*.tar.gz "fulcrum-${VERSION}-linux-${ARCH}.tar.gz"
              # Rivet's production Ed25519 signature must accompany the
              # renamed deterministic tarball, not be lost in dist/.
              signature="dist/fulcrum-${VERSION}-linux-${ARCH}.tar.gz.sig"
              test -s "$signature"
              mv "$signature" "fulcrum-${VERSION}-linux-${ARCH}.tar.gz.sig"
              # rivet's portable zip (with its own sidecar) joins the set.
              test -f "dist/fulcrum-${VERSION}-linux-${ARCH}.zip"
              test -f "dist/fulcrum-${VERSION}-linux-${ARCH}.zip.sha256"
              mv "dist/fulcrum-${VERSION}-linux-${ARCH}.zip" \
                 "dist/fulcrum-${VERSION}-linux-${ARCH}.zip.sha256" .
              # The native installers keep rivet's versioned names (deb arch
              # amd64/arm64, rpm embeds the build number, AppImage
              # x86_64/aarch64); hoist them beside the tar.gz so the
              # checksum loop and the artifact upload glob pick them up.
              for f in dist/fulcrum-*.deb dist/fulcrum-*.rpm dist/fulcrum-*.AppImage; do
                if [ -e "$f" ]; then mv "$f" .; fi
              done
              ;;
          esac
          for f in fulcrum-${VERSION}-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256 "$f" > "$f.sha256"
          done
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-${{ matrix.platform }}-${{ matrix.arch }}
          path: fulcrum-*
          if-no-files-found: error

  channel-manifest:
    name: Sign channel manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          ls -la release/
      - name: Compose and sign the channel manifest
        env:
          # Manifest URLs are tag-pinned (never re-upload under an existing
          # version URL — hashes are pinned by the signed manifest). The
          # signing key + key id still come from the RIVET_UPDATE_* secrets.
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
        run: |
          # One channel manifest pins every platform artifact (see
          # .github/sign-manifest.rkt). The secret carries the PEM; the
          # signer wants DER paths, and the signed output is verified
          # against the public key before upload.
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          openssl pkey -in update-private.pem -pubout -outform DER -out update-public.der
          racket .github/sign-manifest.rkt
      - uses: actions/upload-artifact@v4
        with:
          name: channel-manifest
          path: |
            dist/update-manifest.json
            dist/manifest.json
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    needs: channel-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          cp artifacts/channel-manifest/update-manifest.json release/
          # byte-identical alias for pre-0.8.0 clients polling manifest.json
          cp artifacts/channel-manifest/manifest.json release/
          (cd release && cat *.sha256 > SHA256SUMS)
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            release/fulcrum-*
            release/SHA256SUMS
            release/update-manifest.json
            release/manifest.json
      - name: Stable alias copies (versionless direct-download links)
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Family rule: download buttons point at
          # releases/latest/download/<alias>, so every release also ships
          # versionless copies of the primary installers. Aliases are
          # overwritten on each release; the versioned assets stay canonical.
          mkdir -p stable-alias
          cp "release/fulcrum-${VERSION}-macos-arm64.dmg" stable-alias/fulcrum-macos-arm64.dmg
          cp "release/fulcrum-${VERSION}-macos-x64.dmg" stable-alias/fulcrum-macos-x64.dmg
          cp "release/fulcrum-${VERSION}-windows-x64.msi" stable-alias/fulcrum-windows-x64.msi
          cp "release/fulcrum-${VERSION}-linux-amd64.deb" stable-alias/fulcrum-linux-x64.deb
          cp "release/fulcrum-${VERSION}-linux-arm64.deb" stable-alias/fulcrum-linux-arm64.deb
          cp "release/fulcrum-${VERSION}-linux-x86_64.AppImage" stable-alias/fulcrum-linux-x64.AppImage
          cp "release/fulcrum-${VERSION}-linux-aarch64.AppImage" stable-alias/fulcrum-linux-arm64.AppImage
          gh release upload "$GITHUB_REF_NAME" stable-alias/* --clobber -R turinglambdaai/fulcrum

  publish:
    name: Verify assets and publish release
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Verify installers and signed feed exist before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FULCRUM_STABLE_RELEASE_APPROVED: ${{ vars.FULCRUM_STABLE_RELEASE_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          # Manual tags must not bypass the authorization applied before
          # automatic version-bump tagging. RCs have their own prerelease
          # safety policy; never promote a stable tag without approval.
          if [[ "$GITHUB_REF_NAME" != *-rc.* && "$FULCRUM_STABLE_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Stable release promotion is not approved; draft remains unpublished"
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          test "${tag#v}" != "$tag" || { echo "::error::Not a version tag"; exit 1; }
          tag_version="${tag#v}"
          version="${tag_version%%-rc.*}"
          prerelease=false
          make_latest=true
          if [[ "$tag_version" == *-rc.* ]]; then
            prerelease=true
            make_latest=false
          fi
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release view "$tag" --json isPrerelease --jq '.isPrerelease' | grep -Fx "$prerelease"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          required=(
            "fulcrum-${version}-macos-arm64.dmg" \
            "fulcrum-${version}-macos-x64.dmg" \
            "fulcrum-${version}-windows-x64.msi" \
            "fulcrum-${version}-linux-amd64.deb" \
            "fulcrum-${version}-linux-arm64.deb" \
            "fulcrum-${version}-linux-x86_64.AppImage" \
            "fulcrum-${version}-linux-aarch64.AppImage" \
            "fulcrum-${version}-linux-x64.tar.gz.sig" \
            "fulcrum-${version}-linux-arm64.tar.gz.sig" \
            "update-manifest.json" "manifest.json" "SHA256SUMS")
          if [[ "$prerelease" == false ]]; then
            required+=(
              "fulcrum-macos-arm64.dmg"
              "fulcrum-macos-x64.dmg"
              "fulcrum-windows-x64.msi"
              "fulcrum-linux-x64.deb"
              "fulcrum-linux-arm64.deb"
              "fulcrum-linux-x64.AppImage"
              "fulcrum-linux-arm64.AppImage")
          fi
          for name in "${required[@]}"; do
            printf '%s\n' "$assets" | grep -Fx "$name" || {
              echo "::error::Missing release asset $name"; exit 1;
            }
          done
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')"
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -F prerelease="$prerelease" -f make_latest="$make_latest" >/dev/null
          gh release view "$tag" --json isDraft,isPrerelease \
            --jq '[.isDraft, .isPrerelease] | @tsv' | grep -Fx $'false\t'"$prerelease"
