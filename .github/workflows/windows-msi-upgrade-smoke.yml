name: Windows MSI Upgrade Lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acceptance/windows-msi-upgrade-smoke.ps1'
      - 'scripts/acceptance/windows-signed-feed-smoke.rkt'
      - '.github/workflows/windows-msi-upgrade-smoke.yml'

permissions:
  contents: read

jobs:
  installed-upgrade:
    name: Installed MSI 0.13.3 to 0.14.0
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: x64
      - name: Install pinned Rivet updater dependencies
        shell: bash
        run: |
          racket -e '(dynamic-require (quote db) #f)' || raco pkg install --auto --no-docs db-lib
          raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#746a1c043b9e6fc13e986aee9942afb5500d1f25'
      - name: Verify official signed update discovery and MSI payload
        shell: bash
        run: racket scripts/acceptance/windows-signed-feed-smoke.rkt
      - name: Verify official MSI checksum and real installed major upgrade
        shell: pwsh
        run: |
          ./scripts/acceptance/windows-msi-upgrade-smoke.ps1
