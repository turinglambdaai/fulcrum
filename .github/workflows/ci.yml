name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Checkout Rivet (sibling)
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
        shell: bash
      - name: Compile backend
        run: raco make app/core/*.rkt app/update.rkt app/backend.rkt
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash

  linux-host:
    name: Linux host (official build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
          ref: v0.4.0
      - name: Set up Racket CS 9.3
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet
        run: raco pkg install --auto --no-docs --name rivet --link "$GITHUB_WORKSPACE/rivet"
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev
      - name: Cache embeddable Racket CS
        id: cache-racket-embed
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Point Rivet at the embeddable runtime
        shell: bash
        run: |
          set -euo pipefail
          boot_dir="$(dirname "$(find "$RUNNER_TEMP/racket-embed" -name petite.boot -print -quit)")"
          test -n "$boot_dir" || { echo "petite.boot missing from the embed build" >&2; exit 1; }
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          racket_library="$(find "$RUNNER_TEMP/racket-embed" -maxdepth 6 -name 'libracketcs*.a' -print -quit)"
          test -n "$racket_library" || { echo "libracketcs.a missing from the embed build" >&2; exit 1; }
          echo "RIVET_RACKET_BOOT_DIR=$boot_dir" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$racket_library" >> "$GITHUB_ENV"
      - name: raco rivet doctor
        shell: bash
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
        run: raco rivet doctor
      - name: raco rivet build
        shell: bash
        env:
          RIVET_ROOT: ${{ github.workspace }}/rivet
        run: raco rivet build
      - name: Verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost || { echo "staged RivetHost missing" >&2; find .rivet -maxdepth 3 -print >&2; exit 1; }
          echo "host binary: .rivet/stage/RivetHost"
          test -f .rivet/stage/runtime/petite.boot
          test -f .rivet/stage/runtime/scheme.boot
          test -f .rivet/stage/runtime/racket.boot
          test -f .rivet/stage/res/core.zo

  macos-host:
    name: macOS host compile smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Swift syntax smoke
        run: |
          # Source-only syntax validation of the host sources without the
          # full SwiftPM graph (which needs the staged Racket framework).
          swiftc -version
          for f in macos-host/Sources/RivetHost/*.swift; do
            xcrun swift-frontend -typecheck "$f" 2>/dev/null || \
              echo "::warning::$f needs the full swift build (skipped: missing Rivet runtime graph)"
          done

  windows-host:
    name: Windows host compile smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build WinUI host
        working-directory: windows
        env:
          # Windows App SDK + Rivet host build need the generated .g.h/.g.cpp
          # from a full raco rivet build; msbuild here exercises the XAML
          # compiler and C++20 sources.
          RIVET_SKIP_NATIVE: '1'
        run: msbuild RivetHost.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        continue-on-error: true

  plugin-fixture:
    name: FPP1 fixture plugin end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Checkout + link Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet"
      - name: Install fixture plugin
        run: |
          mkdir -p /tmp/fulcrum-fixture/plugins
          cp -r examples/plugins/epoch /tmp/fulcrum-fixture/plugins/epoch
      - name: Run plugin tests against the fixture layout
        run: raco test tests/plugins-test.rkt
        env:
          FULCRUM_DATA_DIR: /tmp/fulcrum-fixture
