name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
# Contexts aren't allowed in `uses:`, so the setup-embed-racket action
# refs must be bumped in lockstep by hand.
env:
  RIVET_PIN: v0.12.0
jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Schema baseline is compatible
        run: raco rivet schema check rivet-schema.json --json
        shell: bash
      - name: Generated backend clients are current
        if: runner.os == 'Linux'
        run: |
          raco rivet generate
          git diff --exit-code -- \
            linux/GeneratedBackend.hpp \
            macos-host/Sources/RivetHost/GeneratedBackend.swift \
            windows/GeneratedBackend.hpp
        shell: bash
      - name: Verify release version alignment
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Compile backend
        run: raco make app/core/*.rkt app/update.rkt app/backend.rkt
        shell: bash
      - name: Gallery data is fresh
        run: racket scripts/gen-gallery.rkt --check
        shell: bash
      - name: Generated i18n clients are current
        if: runner.os == 'Linux'
        run: |
          raco rivet i18n
          git diff --exit-code -- \
            linux/GeneratedI18n.hpp \
            macos-host/Sources/RivetHost/GeneratedI18n.swift \
            windows/GeneratedI18n.hpp
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash
      - name: Channel manifest smoke test
        if: runner.os == 'Linux'
        env:
          RIVET_UPDATE_BASE_URL: https://example.invalid/fulcrum
          RIVET_UPDATE_KEY_ID: ci-smoke
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          trap 'rm -rf release dist update-private.pem update-private.der update-public.der' EXIT
          mkdir -p release
          for artifact in \
            "fulcrum-${VERSION}-macos-arm64.zip" \
            "fulcrum-${VERSION}-macos-x64.zip" \
            "fulcrum-${VERSION}-windows-x64.msi" \
            "fulcrum-${VERSION}-linux-x64.tar.gz" \
            "fulcrum-${VERSION}-linux-arm64.tar.gz" \
            "fulcrum-${VERSION}-linux-x86_64.AppImage" \
            "fulcrum-${VERSION}-linux-aarch64.AppImage"
          do
            printf 'CI fixture for %s\n' "$artifact" > "release/$artifact"
          done
          openssl genpkey -algorithm ED25519 -out update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          openssl pkey -in update-private.pem -pubout -outform DER -out update-public.der
          racket .github/sign-manifest.rkt
          test -s dist/update-manifest.json
          cmp dist/update-manifest.json dist/manifest.json
        shell: bash

  linux-host:
    name: Linux host (official build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.12.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own.
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev libxtst-dev xvfb xauth dbus-daemon
      - name: X11 hotkey regression tests (private virtual display)
        run: python3 tests/run-linux-hotkey-tests.py
      - name: raco rivet doctor
        shell: bash
        run: raco rivet doctor
      - name: raco rivet build
        shell: bash
        run: raco rivet build
      - name: Generated Linux client is current
        shell: bash
        run: git diff --exit-code -- linux/GeneratedBackend.hpp
      - name: Linux widget regression tests (private virtual display)
        run: |
          cmake --build .rivet/build/linux --target fulcrum-ui-test
          xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" dbus-run-session -- timeout 30s .rivet/build/linux/fulcrum-ui-test
      - name: Verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost || { echo "staged RivetHost missing" >&2; find .rivet -maxdepth 3 -print >&2; exit 1; }
          echo "host binary: .rivet/stage/RivetHost"
          test -f .rivet/stage/runtime/petite.boot
          test -f .rivet/stage/runtime/scheme.boot
          test -f .rivet/stage/runtime/racket.boot
          test -f .rivet/stage/res/core.zo

  macos-host:
    # Authoritative host graph, matching release/acceptance without signing.
    # Source-by-source swift-frontend checks cannot resolve cross-file symbols,
    # the generated client, Rivet packages, or the embedded Racket framework.
    name: macOS host (official build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: arm64
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: raco rivet doctor
        run: raco rivet doctor
        shell: bash
      - name: raco rivet build
        run: raco rivet build
        shell: bash
      - name: Generated macOS client is current
        run: git diff --exit-code -- macos-host/Sources/RivetHost/GeneratedBackend.swift
        shell: bash
      - name: Verify staged host
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost || { echo "staged macOS host missing" >&2; find .rivet -maxdepth 4 -print >&2; exit 1; }
          test -d .rivet/stage/Frameworks/Racket.framework
          test -f .rivet/stage/res/core.zo
          echo "host binary: .rivet/stage/RivetHost"
        shell: bash

  windows-host:
    # The same path the release leg takes (setup-racket → rivet pin →
    # raco rivet build): a bare msbuild cannot see rivet's runtime headers
    # or the generated client, so it only ever failed fast — and behind
    # continue-on-error that read as green. This job is the Windows leg's
    # judge: MSVC + the XAML compiler on the real host sources.
    name: Windows host (official build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: x64
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: raco rivet doctor
        run: raco rivet doctor
        shell: bash
      - name: raco rivet build
        run: raco rivet build
        shell: bash
      - name: Generated Windows client is current
        run: git diff --exit-code -- windows/GeneratedBackend.hpp
        shell: bash
      - name: Verify staged host
        run: |
          set -euo pipefail
          test -n "$(find .rivet/stage -type f -iname 'RivetHost.exe' -print -quit)" || {
            echo "staged Windows host missing" >&2
            find .rivet -maxdepth 4 -print >&2
            exit 1
          }
        shell: bash

  plugin-fixture:
    name: FPP1 fixture plugin end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install fixture plugin
        run: |
          mkdir -p /tmp/fulcrum-fixture/plugins
          cp -r gallery/epoch /tmp/fulcrum-fixture/plugins/epoch
      - name: Run plugin tests against the fixture layout
        run: raco test tests/plugins-test.rkt
        env:
          FULCRUM_DATA_DIR: /tmp/fulcrum-fixture
