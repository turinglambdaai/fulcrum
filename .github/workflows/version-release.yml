name: Gate VERSION bump and dispatch tagged release

# Release tags are minted only after both main-branch CI and executable
# Product Acceptance pass for the EXACT version-bump commit. Existing
# manually pushed tags remain supported by release.yml.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  actions: write

concurrency:
  group: version-release-main
  cancel-in-progress: false

jobs:
  tag-after-green:
    name: Validate, tag and start release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Creating a VERSION bump otherwise creates an immutable tag and
      # dispatches publishing automatically. Fail BEFORE minting the tag
      # unless the publisher explicitly approves and provisions credentials.
      - name: Preflight stable release approval and required signing credentials
        shell: bash
        env:
          RELEASE_APPROVED: ${{ vars.FULCRUM_STABLE_RELEASE_APPROVED }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_APP_SPECIFIC_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          LINUX_SIGN_PRIVATE_KEY: ${{ secrets.LINUX_SIGN_PRIVATE_KEY }}
          LINUX_SIGN_KEY_ID: ${{ secrets.LINUX_SIGN_KEY_ID }}
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_APPROVED" == "true" ]] || {
            echo "::error::Set FULCRUM_STABLE_RELEASE_APPROVED=true only after release approval; no tag was created"
            exit 1
          }
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID MACOS_APP_SPECIFIC_PASSWORD WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD WINDOWS_TIMESTAMP_URL LINUX_SIGN_PRIVATE_KEY LINUX_SIGN_KEY_ID RIVET_UPDATE_PRIVATE_KEY RIVET_UPDATE_KEY_ID; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Required production release secret or variable $name is missing; no tag was created"
              exit 1
            }
          done
          [[ "$RIVET_UPDATE_KEY_ID" == "fulcrum-2026-10" ]] || {
            echo "::error::The configured update key ID differs from the client trust root"
            exit 1
          }
      - name: Await successful main CI and Product Acceptance for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in ci.yml acceptance.yml; do
            completed=0
            for attempt in $(seq 1 150); do
              info="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?event=push&head_sha=$GITHUB_SHA&per_page=20" \
                --jq '[.workflow_runs[0].status // "waiting", .workflow_runs[0].conclusion // "pending"] | @tsv')"
              IFS=$'\t' read -r status conclusion <<< "$info"
              echo "$workflow attempt=$attempt status=$status conclusion=$conclusion"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "::error::$workflow did not pass for $GITHUB_SHA"
                  exit 1
                fi
                completed=1
                break
              fi
              sleep 20
            done
            if [[ "$completed" != 1 ]]; then
              echo "::error::Timed out awaiting $workflow for $GITHUB_SHA"
              exit 1
            fi
          done
      - name: Validate version and create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          bash scripts/check-release-version.sh "$tag"
          grep -Fq "## [$version]" CHANGELOG.md || { echo "::error::Missing changelog section"; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$tag" ||
              gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists; refusing to republish"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Fulcrum $tag"
          git push origin "refs/tags/$tag"
          # Tags pushed by GITHUB_TOKEN intentionally do not trigger push
          # workflows. workflow_dispatch IS explicitly exempt from that rule.
          gh workflow run release.yml --ref "$tag" --repo "$GH_REPO"
