name: Debug secrets presence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret lengths and fingerprints (never values)
        env:
          KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          UPDATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          LINUX_KEY: ${{ secrets.LINUX_SIGN_PRIVATE_KEY }}
          LINUX_ID: ${{ secrets.LINUX_SIGN_KEY_ID }}
          TS_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          report() { printf '%s len=%s sha256_8=%s\n' "$1" "${#2}" "$(printf '%s' "$2" | shasum -a 256 | cut -c1-8)"; }
          report RIVET_UPDATE_KEY_ID "$KEY_ID"
          report RIVET_UPDATE_PRIVATE_KEY "$UPDATE_KEY"
          report LINUX_SIGN_PRIVATE_KEY "$LINUX_KEY"
          report LINUX_SIGN_KEY_ID "$LINUX_ID"
          report WINDOWS_TIMESTAMP_URL "$TS_URL"
          printf 'KEY_ID raw hex tail: %s\n' "$(printf '%s' "$KEY_ID" | xxd -p | tail -c 24)"
