<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Fulcrum macOS Finder DMG background, authored at 1x (660x400 pixels
       for the 660x400-point window). Finder draws the icon-view background
       at its native pixel size without auto-scaling, so the raster must
       equal the window exactly; a 2x artwork renders cropped. Keep text out
       of the icon slots at (130,160) and (450,160) (80pt icons, labels
       render below them): no text left of x=215 or right of x=445 between
       y=150 and y=245. -->
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF6"/>
      <stop offset="1" stop-color="#F5EFE4"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#canvas)"/>
  <rect x="8" y="8" width="644" height="384" rx="12"
        fill="none" stroke="#D97706" stroke-opacity="0.18" stroke-width="1"/>

  <text x="330" y="64" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="0.25" fill="#27221B">Fulcrum</text>
  <text x="330" y="94" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" fill="#6B6154">One keystroke. Everything within reach.</text>

  <!-- Rivet places the Fulcrum.app Finder icon on the left and the
       Applications alias on the right; the cue stays between them, aligned
       with the icon row's vertical center (y=200). Solid strokes: a
       bounding-box gradient degenerates on a flat horizontal line and
       librsvg silently skips it. -->
  <text x="330" y="196" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="2"
        fill="#945009">DRAG TO INSTALL</text>
  <path d="M 224 214 H 404"
        stroke="#D97706" stroke-opacity="0.85"
        stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 392 204 L 404 214 L 392 224"
        stroke="#B45309" stroke-width="4" stroke-linejoin="round"
        stroke-linecap="round" fill="none"/>

  <!-- The window bounds include the ~28pt title bar, so the content area
       is ~660x372; keep the instructions above y=360 or the bottom line
       hides behind the window chrome. -->
  <text x="330" y="308" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#42392F">Drag Fulcrum into Applications</text>
  <text x="330" y="331" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" fill="#827364">Then open Fulcrum from Applications</text>
</svg>
